<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.title})}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="position-relative bg-light" style="height: 100vh;">
    <div class="position-absolute top-50 start-50 translate-middle text-center">
        <h1 class="display-4 fw-bold" th:text="#{msg.title}">VaultTC</h1>
        <p class="lead text-muted" th:text="#{msg.index.subtitle}"></p>
        <a class="btn btn-primary mt-2" th:href="@{/characters}" th:text="#{msg.index.cta}"></a>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
