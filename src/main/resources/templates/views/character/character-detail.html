<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{msg.title})}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle del personaje: {nombre} -->
        <h1>
            <span th:text="#{msg.character-detail.title}"></span>:
            <span th:text="${character.name}"></span>
        </h1>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Imagen del personaje -->
        <div class="text-center mt-3" th:if="${character.imageUrl != null}">
            <img th:src="@{'/uploads/' + ${character.imageUrl}}" th:alt="${character.name}" class="character-preview">
        </div>

        <!-- Datos del personaje -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.character-detail.section.characterData}"></h2>
            <dl class="row">
                <dt class="col-sm-4" th:text="#{msg.character-detail.field.id}"></dt>
                <dd class="col-sm-8" th:text="${character.id}"></dd>

                <dt class="col-sm-4" th:text="#{msg.character-detail.field.name}"></dt>
                <dd class="col-sm-8" th:text="${character.name}"></dd>

                <dt class="col-sm-4" th:text="#{msg.character-detail.field.description}"></dt>
                <dd class="col-sm-8" th:text="${character.description} ?: '—'"></dd>
            </dl>
        </div>

        <!-- Juego asociado (relación 1:N) -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.character-detail.section.game}"></h2>

            <div th:if="${character.game == null}" class="alert alert-info"
                 th:text="#{msg.character-detail.game.empty}"></div>

            <dl class="row" th:if="${character.game != null}">
                <dt class="col-sm-4" th:text="#{msg.character-detail.game.field.id}"></dt>
                <dd class="col-sm-8" th:text="${character.game.id}"></dd>

                <dt class="col-sm-4" th:text="#{msg.character-detail.game.field.name}"></dt>
                <dd class="col-sm-8" th:text="${character.game.name}"></dd>
            </dl>
        </div>

        <!-- Acciones -->
        <div class="mt-4">
            <a class="btn btn-primary" th:href="@{/characters/edit(id=${character.id})}"
               th:text="#{msg.character-list.edit}"></a>
            <a class="btn btn-secondary" th:href="@{/characters}" th:text="#{msg.character-detail.action.back}"></a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
